<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PeregrinoBits</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="PeregrinoBitsWebsite.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script>
        // Language preference: a previously chosen one wins, otherwise the
        // browser's own setting. Storage can throw in private mode, so it is
        // always guarded.
        window.peregrinoBits = {
            supported: ["EN", "ES", "PT", "FR"],
            pickLanguage: function () {
                try {
                    var saved = localStorage.getItem("pb-lang");
                    if (saved && this.supported.indexOf(saved) >= 0) {
                        return saved;
                    }
                } catch (e) { /* private mode or blocked storage */ }

                var tags = (navigator.languages && navigator.languages.length)
                    ? navigator.languages
                    : [navigator.language || "en"];

                for (var i = 0; i < tags.length; i++) {
                    var code = String(tags[i]).slice(0, 2).toUpperCase();
                    if (this.supported.indexOf(code) >= 0) {
                        return code;
                    }
                }
                return "EN";
            },
            rememberLanguage: function (lang) {
                try {
                    localStorage.setItem("pb-lang", lang);
                } catch (e) { /* nothing to do - the toggle still works */ }
            }
        };
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
